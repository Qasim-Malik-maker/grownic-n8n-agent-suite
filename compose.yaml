name: grownic-agents
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_DB: grownic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run configure}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run npm run configure}
    volumes:
      - grownic_db:/var/lib/postgresql/data
      - ./sql:/grownic-sql:ro
      - ./config/client.json:/grownic-client.json:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-grownic.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bootstrap -d grownic"]
      interval: 5s
      timeout: 5s
      retries: 20
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.7
    restart: unless-stopped
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run npm run configure}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Run npm run configure}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/imports/workflows:ro
      - ./all-workflows.json:/imports/all-workflows.json:ro
      - ./runtime:/imports/runtime:ro
    depends_on:
      postgres: {condition: service_healthy}
  runners:
    image: n8nio/runners:2.38.7
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?Run npm run configure}
    depends_on: [n8n]
  gateway:
    image: node:22-alpine
    user: node
    read_only: true
    restart: unless-stopped
    command: [node, /app/webhook-gateway.mjs]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./deploy/webhook-gateway.mjs:/app/webhook-gateway.mjs:ro"]
    environment:
      N8N_INTERNAL_BASE: http://n8n:5678
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8080}
      GROWNIC_WEBHOOK_KEY: ${GROWNIC_WEBHOOK_KEY:?Run npm run configure}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      CAL_WEBHOOK_SECRET: ${CAL_WEBHOOK_SECRET:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on: [n8n]
volumes:
  grownic_db:
  n8n_data:
